<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rchat — Et maintenant, on fait quoi ?</title>
<style>
:root{--bg:#070b1a;--card:#101733;--line:#26305c;--txt:#e8ecff;--mute:#8d97c7;--cy:#2de2ff;--mg:#ff3ea5;--ok:#47f5a0}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 500px at 50% -10%,#1a2760 0,transparent 70%),var(--bg);color:var(--txt);font:16px/1.5 "Segoe UI",system-ui,sans-serif;padding:24px 14px 60px}
main{max-width:680px;margin:0 auto}
h1{font-size:clamp(26px,6vw,38px);line-height:1.1;margin:8px 0 6px;color:var(--cy);text-shadow:0 0 18px #2de2ff66}
.sub{color:var(--mute);margin:0 0 24px}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px;margin-bottom:14px}
.q[hidden]{display:none}
.q h2{font-size:17px;margin:0 0 4px}
.q small{color:var(--mute);display:block;margin-bottom:10px}
label.o{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin:6px 0;border:1px solid var(--line);border-radius:10px;cursor:pointer}
label.o:hover{border-color:var(--cy)}
label.o:has(input:checked){border-color:var(--cy);background:#2de2ff14;box-shadow:0 0 12px #2de2ff33}
label.o input{margin-top:4px;accent-color:var(--cy)}
.sc{display:flex;gap:8px}.sc label.o{flex:1;justify-content:center;margin:0}
input[type=text],textarea{width:100%;background:#0a1030;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;margin-top:6px}
textarea{min-height:90px;resize:vertical}
:focus-visible{outline:2px solid var(--mg);outline-offset:2px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 22px;cursor:pointer;background:linear-gradient(90deg,var(--cy),var(--mg));color:#050816}
button.sec{background:transparent;color:var(--cy);border:1px solid var(--cy);padding:8px 14px}
.err{color:#ff7a8a;min-height:22px;margin:8px 0}
#res{display:none}
pre{background:#050816;border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;font-size:13px;white-space:pre-wrap;word-break:break-word}
.st{padding:10px 12px;border-radius:10px;margin:10px 0;border:1px solid var(--line)}
.st.ok{border-color:var(--ok);color:var(--ok)}.st.ko{border-color:#ff7a8a;color:#ff7a8a}
</style>
  <link rel="stylesheet" href="rchat-global.css">
</head>
<body>
<main>
<div id="form">
  <h1>Et maintenant, on fait quoi pour Rchat ?</h1>
  <p class="sub">Une minute, quelques clics. Tes réponses décident si on améliore le fond, si on crée un nouveau module, ou si on part sur autre chose.</p>
  <div id="qs"></div>
  <div class="err" id="err" role="alert"></div>
  <button id="go" type="button">Envoyer mes réponses</button>
</div>

<section id="res" aria-live="polite">
  <h1>Merci !</h1>
  <div class="st" id="st"></div>
  <p class="sub">Voici le SQL correspondant à tes réponses (utile si l’envoi automatique n’est pas configuré) :</p>
  <pre id="sql"></pre>
  <button class="sec" id="copy" type="button">Copier le SQL</button>
</section>
</main>

<script>
// ===== CONFIG : mets l'URL et la clé "anon public" de ton projet Supabase =====
// (Settings > API). Laisse vide pour seulement générer le SQL.
const SUPABASE_URL = "";
const SUPABASE_KEY = "";
const TABLE = "rchat_qcm_reponses";

const Q = [
 {id:"priorite", t:"Aujourd’hui, Rchat a surtout besoin de…", type:"one", req:true, o:[
  ["fond","Améliorer le fond (vitesse, stabilité, sécurité, design)"],
  ["module","Un nouveau module"],
  ["autre","Autre chose"]]},
 {id:"chantiers_fond", t:"Côté fond, qu’est-ce qui compte le plus ?", h:"Plusieurs choix possibles", type:"multi",
  show:a=>a.priorite==="fond", o:[
  ["vitesse","Rapidité et fluidité du chat"],["bugs","Moins de bugs, plus de stabilité"],
  ["securite","Sécurité et filtre d’insultes"],["design","Design et lisibilité"],
  ["notifs","Notifications"],["recherche","Recherche dans les messages"],["admin","Outils d’administration"]]},
 {id:"modules", t:"Quel nouveau module te ferait le plus envie ?", h:"Plusieurs choix possibles", type:"multi",
  show:a=>a.priorite==="module", other:"module_autre", o:[
  ["jeux","Jeux et défis"],["ia","Assistant IA"],["vocal","Salons vocaux / appels"],
  ["profils","Profils, amis et badges"],["boutique","Boutique / Rchat+"],["autre","Un autre module (je précise)"]]},
 {id:"gene", t:"Qu’est-ce qui te gêne le plus aujourd’hui ?", type:"one", o:[
  ["rien","Rien, tout va bien"],["lent","C’est parfois lent"],["bug","Des bugs"],
  ["manque","Il manque des fonctionnalités"],["moderation","La modération"]]},
 {id:"fluidite", t:"Le chat en direct, c’est comment ?", h:"1 = pas fluide, 5 = très fluide", type:"scale"},
 {id:"frequence", t:"Tu utilises Rchat…", type:"one", o:[
  ["jour","Tous les jours"],["semaine","Chaque semaine"],["rare","Rarement"],["premiere","C’est ma première fois"]]},
 {id:"appareil", t:"Sur quel appareil ?", type:"one", o:[
  ["mobile","Téléphone"],["pc","Ordinateur"],["les2","Les deux"]]},
 {id:"commentaire", t:"Une idée ou un commentaire ?", h:"Facultatif (obligatoire si tu as choisi « Autre chose »)", type:"text"}
];
const A = {};
const box = document.getElementById("qs");

function el(tag, cls, txt){const e=document.createElement(tag); if(cls) e.className=cls; if(txt!==undefined) e.textContent=txt; return e}

function build(){
  Q.forEach(q=>{
    const s=el("div","q"); s.id="q_"+q.id; s.append(el("h2","",q.t));
    if(q.h) s.append(el("small","",q.h));
    if(q.type==="text"){
      const ta=el("textarea"); ta.maxLength=600; ta.oninput=()=>{A[q.id]=ta.value}; s.append(ta);
    } else if(q.type==="scale"){
      const w=el("div","sc");
      [1,2,3,4,5].forEach(n=>w.append(opt(q,n,String(n),"radio")));
      s.append(w);
    } else {
      q.o.forEach(([v,l])=>s.append(opt(q,v,l,q.type==="multi"?"checkbox":"radio")));
      if(q.other){
        const i=el("input"); i.type="text"; i.maxLength=200; i.placeholder="Quel module ?"; i.hidden=true;
        i.id="in_"+q.other; i.oninput=()=>{A[q.other]=i.value}; s.append(i);
      }
    }
    box.append(s);
  });
  refresh();
}
function opt(q,v,l,type){
  const lb=el("label","o"), i=el("input"); i.type=type; i.name=q.id; i.value=v;
  i.onchange=()=>{
    if(type==="checkbox"){A[q.id]=[...document.querySelectorAll('input[name="'+q.id+'"]:checked')].map(x=>x.value)}
    else A[q.id]=(q.type==="scale")?Number(v):v;
    refresh();
  };
  lb.append(i,el("span","",l)); return lb;
}
function refresh(){
  Q.forEach(q=>{ if(q.show) document.getElementById("q_"+q.id).hidden=!q.show(A) });
  const i=document.getElementById("in_module_autre");
  if(i) i.hidden=!(A.modules||[]).includes("autre");
}

function check(){
  if(!A.priorite) return "Choisis d’abord ce dont Rchat a le plus besoin.";
  if(A.priorite==="module" && !(A.modules||[]).length) return "Choisis au moins un module.";
  if(A.priorite==="module" && (A.modules||[]).includes("autre") && !(A.module_autre||"").trim()) return "Précise quel module tu imagines.";
  if(A.priorite==="autre" && !(A.commentaire||"").trim()) return "Dis-nous en un mot ce que tu imagines (dernière question).";
  return "";
}
function payload(){
  const p={priorite:A.priorite, chantiers_fond:A.priorite==="fond"?(A.chantiers_fond||[]):[],
    modules:A.priorite==="module"?(A.modules||[]):[], module_autre:null,
    gene:A.gene||null, frequence:A.frequence||null, appareil:A.appareil||null,
    fluidite:A.fluidite||null, commentaire:(A.commentaire||"").trim()||null};
  if(p.modules.includes("autre")) p.module_autre=(A.module_autre||"").trim()||null;
  return p;
}
const lit=v=>v===null||v===undefined?"null":typeof v==="number"?String(v):"'"+String(v).replace(/'/g,"''")+"'";
const arr=a=>a.length?"array["+a.map(lit).join(",")+"]::text[]":"'{}'::text[]";
function toSQL(p){
  return "insert into public."+TABLE+"\n (priorite, chantiers_fond, modules, module_autre, gene, frequence, appareil, fluidite, commentaire)\nvalues\n ("+
    [lit(p.priorite),arr(p.chantiers_fond),arr(p.modules),lit(p.module_autre),lit(p.gene),lit(p.frequence),lit(p.appareil),lit(p.fluidite),lit(p.commentaire)].join(", ")+");";
}

document.getElementById("go").onclick=async()=>{
  const e=check(), er=document.getElementById("err"); er.textContent=e; if(e) return;
  const p=payload(), st=document.getElementById("st");
  document.getElementById("sql").textContent=toSQL(p);
  document.getElementById("form").style.display="none";
  document.getElementById("res").style.display="block";
  if(!SUPABASE_URL||!SUPABASE_KEY){
    st.className="st"; st.textContent="Envoi automatique non configuré : copie le SQL ci-dessous dans Supabase.";
    return;
  }
  st.className="st"; st.textContent="Envoi en cours…";
  try{
    const r=await fetch(SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/"+TABLE,{method:"POST",
      headers:{"Content-Type":"application/json",apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,Prefer:"return=minimal"},
      body:JSON.stringify(p)});
    if(r.ok){st.className="st ok";st.textContent="Réponses enregistrées. Merci !"}
    else{st.className="st ko";st.textContent="Envoi refusé (code "+r.status+"). Vérifie que rchat_qcm.sql a bien été exécuté, ou copie le SQL ci-dessous."}
  }catch(x){st.className="st ko";st.textContent="Envoi impossible (réseau). Copie le SQL ci-dessous."}
};
document.getElementById("copy").onclick=async()=>{
  const b=document.getElementById("copy");
  try{await navigator.clipboard.writeText(document.getElementById("sql").textContent);b.textContent="Copié"}
  catch(x){b.textContent="Sélectionne le texte et copie-le à la main"}
};
build();
</script>
  <script src="rchat-global.js" defer></script>
</body>
</html>
